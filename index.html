<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root{
            --bg:#0f1115;
            --panel:#141826;
            --panel2:#10131a;
            --text:#f2f4f8;
            --muted:#aab2c0;
            --border:#2a3140;
            --white:#ffffff;

            --good:#9fe7b3;
            --good2:rgba(159,231,179,.15);
            --bad:#ff7a7a;
            --bad2:rgba(255,122,122,.15);

            --shadow: 0 10px 30px rgba(0,0,0,.35);
        }

        *{margin:0;padding:0;box-sizing:border-box}
        body{
            font-family:'Sora',sans-serif;
            background:
              radial-gradient(900px 500px at 20% 10%, rgba(255,255,255,.06), transparent 60%),
              radial-gradient(900px 500px at 80% 90%, rgba(255,255,255,.04), transparent 60%),
              var(--bg);
            min-height:100vh;
            color:var(--text);
        }

        .app-wrapper{max-width:1100px;margin:0 auto;padding:32px 18px 60px;}
        .topbar{
            display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;
        }
        .header{
            display:flex;gap:12px;align-items:flex-end;
        }
        .header-icon{
            width:50px;height:50px;border-radius:14px;background:var(--white);
            color:#0f1115; display:flex; align-items:center; justify-content:center;
            font-size:24px;font-weight:800; box-shadow:var(--shadow);
            flex-shrink:0;
        }
        h1{font-size:26px;letter-spacing:-.4px;}
        .sub{color:var(--muted);font-size:13px;margin-top:2px;}
        .actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:flex-end;}
        .pill{
            border:1px solid rgba(255,255,255,.18);
            background: rgba(0,0,0,.2);
            padding:9px 12px;
            border-radius:999px;
            color:var(--muted);
            font-size:12px;
        }

        .btn{
            font-family:'Sora',sans-serif;
            font-weight:700;
            font-size:13px;
            padding:10px 14px;
            border-radius:10px;
            border:1px solid rgba(255,255,255,.18);
            background: rgba(255,255,255,.08);
            color: var(--text);
            cursor:pointer;
            transition: all .15s ease;
        }
        .btn:hover{transform: translateY(-1px); background: rgba(255,255,255,.12);}
        .btn.primary{
            background: var(--white);
            color:#0f1115;
            border-color: transparent;
        }
        .btn.danger{
            background: rgba(255,255,255,.06);
            border-color: rgba(255,255,255,.18);
        }
        .btn-remove{
            background: var(--bad2);
            border:1px solid rgba(255,122,122,.35);
            color: var(--bad);
            padding:6px 10px;
            font-size:12px;
            border-radius:10px;
            cursor:pointer;
            font-weight:800;
        }

        .tabs{
            display:flex;gap:6px;
            border:1px solid rgba(255,255,255,.14);
            background: rgba(0,0,0,.18);
            padding:6px;border-radius:14px;
            width:fit-content;
            margin-bottom:18px;
        }
        .tab{
            padding:10px 18px;border-radius:12px;border:none;
            background: transparent;color: var(--muted);
            cursor:pointer;font-weight:700;font-size:13px;
        }
        .tab.active{background: rgba(255,255,255,.12); color: var(--text);}

        .card{
            background: linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.02));
            border:1px solid rgba(255,255,255,.14);
            border-radius:16px;
            padding:20px;
            box-shadow: var(--shadow);
            margin-bottom:16px;
        }
        .card-title{
            font-size:14px;font-weight:800;color:var(--text);
            display:flex;align-items:center;gap:10px;margin-bottom:14px;
        }
        .card-title::before{
            content:""; width:3px;height:16px;border-radius:2px;background: var(--white);
            display:block;
        }

        .form-row{
            display:grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap:12px;
            margin-bottom:12px;
        }
        label{
            font-size:11px;color:var(--muted);
            text-transform:uppercase;letter-spacing:.8px;font-weight:800;
            margin-bottom:6px;display:block;
        }
        input, select{
            width:100%;
            padding:10px 12px;
            border-radius:10px;
            border:1px solid rgba(255,255,255,.14);
            background: rgba(0,0,0,.20);
            color: var(--text);
            outline:none;
        }
        input:focus, select:focus{border-color: rgba(255,255,255,.35);}
        .split-section{
            background: rgba(0,0,0,.18);
            border:1px solid rgba(255,255,255,.12);
            border-radius:14px;
            padding:14px;
            margin-top:10px;
        }
        .person-row{display:flex;gap:10px;align-items:center;margin-bottom:10px;}
        .person-row input{flex:1;}

        .table-wrap{
            overflow-x:auto;
            border-radius:14px;
            border:1px solid rgba(255,255,255,.12);
        }
        table{width:100%;border-collapse:collapse;font-size:13px;}
        thead tr{background: rgba(255,255,255,.06);}
        th{
            color: var(--muted);
            font-size:11px;font-weight:900;
            text-transform:uppercase;letter-spacing:.8px;
            padding:12px 14px; text-align:left; white-space:nowrap;
        }
        td{
            padding:12px 14px;
            border-top: 1px solid rgba(255,255,255,.08);
            vertical-align:middle;
        }
        tbody tr:hover{background: rgba(255,255,255,.04);}
        .amount-cell{font-family:'DM Mono',monospace;font-weight:600;}
        .badge{
            display:inline-block;
            padding:4px 10px;
            border-radius:999px;
            border:1px solid rgba(255,255,255,.14);
            background: rgba(255,255,255,.06);
            color: var(--text);
            font-size:11px;
            font-weight:800;
            white-space:nowrap;
        }
        .badge-split{background: var(--good2); border-color: rgba(159,231,179,.35); color: var(--good);}
        .badge-owe{background: var(--bad2); border-color: rgba(255,122,122,.35); color: var(--bad);}
        .badge-even{background: rgba(255,255,255,.06); color: var(--muted);}

        .summary-grid{
            display:grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap:12px;
            margin-bottom:12px;
        }
        .stat{
            background: rgba(0,0,0,.18);
            border:1px solid rgba(255,255,255,.12);
            border-radius:16px;
            padding:16px;
        }
        .stat-label{font-size:11px;color:var(--muted);font-weight:900;text-transform:uppercase;letter-spacing:.8px;}
        .stat-value{font-family:'DM Mono',monospace;font-size:26px;font-weight:700;margin-top:8px;}

        .empty{padding:40px 18px; text-align:center; color: var(--muted);}
        .empty h3{color:var(--text); font-size:15px; margin-bottom:6px;}
        .tab-content{display:none;}
        .tab-content.active{display:block;}

        .filters{
            display:flex; gap:10px; flex-wrap:wrap; align-items:end;
            margin-bottom: 12px;
        }
        .filters .form-group{min-width:160px; flex: 1;}
        .small-note{color:var(--muted); font-size:12px; margin-top:6px;}
        @media(max-width:640px){
            .actions{justify-content:flex-start}
            h1{font-size:22px}
        }
    </style>
</head>
<body>
<div class="app-wrapper">

    <div class="topbar">
        <div class="header">
            <div class="header-icon">₿</div>
            <div>
                <h1>Expense Tracker</h1>
                <div class="sub">Black/white theme • Secure login • CSV export • Per-user data</div>
            </div>
        </div>

        <div class="actions">
            <div class="pill" id="whoami">Signed in</div>
            <button class="btn" type="button" onclick="downloadCSV()">⬇ Export CSV</button>
            <button class="btn danger" type="button" onclick="logout()">Logout</button>
        </div>
    </div>

    <div class="tabs">
        <button class="tab active" onclick="switchTab('personal', this)">Personal</button>
        <button class="tab" onclick="switchTab('split', this)">Split Bills</button>
        <button class="tab" onclick="switchTab('summary', this)">Summary</button>
    </div>

    <!-- PERSONAL -->
    <div id="personal" class="tab-content active">
        <div class="card">
            <div class="card-title">Add Personal Expense</div>
            <form id="personalForm">
                <div class="form-row">
                    <div>
                        <label>Date</label>
                        <input type="date" id="p-date" required>
                    </div>
                    <div>
                        <label>Category</label>
                        <select id="p-category" required>
                            <option value="">Select…</option>
                            <option>🍔 Food</option>
                            <option>🚗 Transport</option>
                            <option>🛍️ Shopping</option>
                            <option>🎬 Entertainment</option>
                            <option>📄 Bills</option>
                            <option>⚕️ Healthcare</option>
                            <option>📌 Other</option>
                        </select>
                    </div>
                    <div>
                        <label>Amount ($)</label>
                        <input type="number" id="p-amount" step="0.01" min="0" placeholder="0.00" required>
                    </div>
                </div>
                <div>
                    <label>Description</label>
                    <input type="text" id="p-desc" placeholder="What did you spend on?" required>
                </div>
                <div style="margin-top:14px;">
                    <button type="submit" class="btn primary">Add Expense</button>
                </div>
            </form>
        </div>

        <div class="card">
            <div class="card-title">Filters</div>
            <div class="filters">
                <div class="form-group">
                    <label>Search</label>
                    <input id="p-search" placeholder="Search description..." />
                </div>
                <div class="form-group">
                    <label>Category</label>
                    <select id="p-filter-cat">
                        <option value="">All</option>
                        <option>🍔 Food</option><option>🚗 Transport</option><option>🛍️ Shopping</option>
                        <option>🎬 Entertainment</option><option>📄 Bills</option><option>⚕️ Healthcare</option><option>📌 Other</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>From</label>
                    <input type="date" id="p-from" />
                </div>
                <div class="form-group">
                    <label>To</label>
                    <input type="date" id="p-to" />
                </div>
                <button class="btn" type="button" onclick="renderPersonal()">Apply</button>
            </div>
            <div class="small-note">Tip: filters are instant and work on your saved database data.</div>
        </div>

        <div id="personalList"></div>
    </div>

    <!-- SPLIT -->
    <div id="split" class="tab-content">
        <div class="card">
            <div class="card-title">Add Split Expense</div>
            <form id="splitForm">
                <div class="form-row">
                    <div>
                        <label>Date</label>
                        <input type="date" id="s-date" required>
                    </div>
                    <div>
                        <label>Category</label>
                        <select id="s-category" required>
                            <option value="">Select…</option>
                            <option>🍔 Food</option>
                            <option>🚗 Transport</option>
                            <option>🛍️ Shopping</option>
                            <option>🎬 Entertainment</option>
                            <option>📄 Bills</option>
                            <option>✈️ Travel</option>
                            <option>📌 Other</option>
                        </select>
                    </div>
                    <div>
                        <label>Total Amount ($)</label>
                        <input type="number" id="s-amount" step="0.01" min="0" placeholder="0.00" required>
                    </div>
                </div>
                <div class="form-row">
                    <div>
                        <label>Description</label>
                        <input type="text" id="s-desc" placeholder="What was this for?" required>
                    </div>
                    <div>
                        <label>Paid By</label>
                        <input type="text" id="s-paidby" placeholder="Who paid?" required>
                    </div>
                </div>

                <div class="split-section">
                    <label style="margin-bottom:10px;">Split Between</label>
                    <div id="splitPeople">
                        <div class="person-row">
                            <input type="text" placeholder="Person name" class="p-name" required>
                            <input type="number" placeholder="Amount" step="0.01" class="p-amt" required>
                        </div>
                    </div>
                    <button type="button" class="btn" onclick="addPerson()">+ Add Person</button>
                </div>

                <div style="margin-top:12px;">
                    <button type="submit" class="btn primary">Add Split Expense</button>
                </div>
            </form>
        </div>

        <div id="splitList"></div>
    </div>

    <!-- SUMMARY -->
    <div id="summary" class="tab-content">
        <div class="summary-grid">
            <div class="stat">
                <div class="stat-label">Personal Total</div>
                <div class="stat-value" id="s-personal">$0.00</div>
            </div>
            <div class="stat">
                <div class="stat-label">Split Total</div>
                <div class="stat-value" id="s-split">$0.00</div>
            </div>
            <div class="stat">
                <div class="stat-label">Grand Total</div>
                <div class="stat-value" id="s-grand">$0.00</div>
            </div>
        </div>

        <div class="card">
            <div class="card-title">Category Breakdown</div>
            <div id="catBreakdown"></div>
        </div>

        <div class="card">
            <div class="card-title">Balance Summary</div>
            <div id="balanceSummary"></div>
        </div>
    </div>

</div>

<script>
    let personalExpenses = [];
    let splitExpenses    = [];

    document.getElementById('p-date').valueAsDate = new Date();
    document.getElementById('s-date').valueAsDate = new Date();

    function switchTab(id, btn) {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById(id).classList.add('active');
        if (id === 'summary') renderSummary();
    }

    async function api(url, options = {}) {
        const res = await fetch(url, {
            headers: { "Content-Type": "application/json" },
            ...options
        });
        const data = await res.json().catch(()=> ({}));
        if (!res.ok) throw new Error(data.error || "Request failed");
        return data;
    }

    async function loadAll() {
        personalExpenses = await api("/api/personal", { method: "GET" });
        splitExpenses    = await api("/api/split", { method: "GET" });
        renderPersonal();
        renderSplit();
    }

    async function loadMe(){
        const me = await fetch("/api/auth/me").then(r=>r.json());
        document.getElementById("whoami").textContent =
            me.loggedIn ? `Signed in as ${me.username}` : "Not signed in";
        if (!me.loggedIn) window.location.href = "/";
    }

    async function logout(){
        await api("/api/auth/logout", { method: "POST", body: "{}" });
        window.location.href = "/";
    }

    async function downloadCSV() {
        const res = await fetch("/api/export.csv");
        if (!res.ok) return alert("Export failed");
        const blob = await res.blob();
        const url = URL.createObjectURL(blob);

        const a = document.createElement("a");
        a.href = url;
        a.download = "expenses_export.csv";
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
    }

    document.getElementById('personalForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        try {
            await api("/api/personal", {
                method: "POST",
                body: JSON.stringify({
                    date: document.getElementById('p-date').value,
                    category: document.getElementById('p-category').value,
                    amount: parseFloat(document.getElementById('p-amount').value),
                    desc: document.getElementById('p-desc').value
                })
            });
            await loadAll();
            this.reset();
            document.getElementById('p-date').valueAsDate = new Date();
        } catch (err) {
            alert(err.message);
        }
    });

    document.getElementById('splitForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const people = [];
        document.querySelectorAll('#splitPeople .person-row').forEach(row => {
            const n = row.querySelector('.p-name').value.trim();
            const a = parseFloat(row.querySelector('.p-amt').value);
            if (n && !isNaN(a)) people.push({ name: n, amount: a });
        });

        try {
            await api("/api/split", {
                method: "POST",
                body: JSON.stringify({
                    date: document.getElementById('s-date').value,
                    category: document.getElementById('s-category').value,
                    amount: parseFloat(document.getElementById('s-amount').value),
                    desc: document.getElementById('s-desc').value,
                    paidBy: document.getElementById('s-paidby').value,
                    people
                })
            });
            await loadAll();
            this.reset();
            document.getElementById('s-date').valueAsDate = new Date();
            document.getElementById('splitPeople').innerHTML = `
                <div class="person-row">
                    <input type="text" placeholder="Person name" class="p-name" required>
                    <input type="number" placeholder="Amount" step="0.01" class="p-amt" required>
                </div>`;
        } catch (err) {
            alert(err.message);
        }
    });

    function addPerson() {
        const row = document.createElement('div');
        row.className = 'person-row';
        row.innerHTML = `
            <input type="text" placeholder="Person name" class="p-name" required>
            <input type="number" placeholder="Amount" step="0.01" class="p-amt" required>
            <button type="button" class="btn-remove" onclick="this.parentElement.remove()">✕</button>`;
        document.getElementById('splitPeople').appendChild(row);
    }

    function passesPersonalFilters(e){
        const q = (document.getElementById("p-search").value || "").trim().toLowerCase();
        const cat = document.getElementById("p-filter-cat").value;
        const from = document.getElementById("p-from").value;
        const to = document.getElementById("p-to").value;

        if (q && !(String(e.desc || "").toLowerCase().includes(q))) return false;
        if (cat && e.category !== cat) return false;
        if (from && e.date < from) return false;
        if (to && e.date > to) return false;
        return true;
    }

    function renderPersonal() {
        const el = document.getElementById('personalList');
        const filtered = personalExpenses.filter(passesPersonalFilters);

        if (!filtered.length) {
            el.innerHTML = `<div class="card"><div class="empty"><h3>No matching expenses</h3><div>Try adjusting your filters.</div></div></div>`;
            return;
        }

        const sorted = [...filtered].sort((a,b)=> new Date(b.date)-new Date(a.date));
        el.innerHTML = `<div class="table-wrap"><table>
            <thead><tr>
                <th>Date</th><th>Category</th><th>Description</th><th>Amount</th><th></th>
            </tr></thead>
            <tbody>
                ${sorted.map(e => `<tr>
                    <td style="color:var(--muted);font-size:12px;">${fmt(e.date)}</td>
                    <td><span class="badge">${e.category}</span></td>
                    <td>${escapeHtml(e.desc)}</td>
                    <td class="amount-cell">$${Number(e.amount).toFixed(2)}</td>
                    <td><button class="btn-remove" onclick="delP(${e.id})">✕</button></td>
                </tr>`).join('')}
            </tbody>
        </table></div>`;
    }

    function renderSplit() {
        const el = document.getElementById('splitList');
        if (!splitExpenses.length) {
            el.innerHTML = `<div class="card"><div class="empty"><h3>No split expenses yet</h3><div>Add an expense to split with others.</div></div></div>`;
            return;
        }
        const sorted = [...splitExpenses].sort((a,b)=> new Date(b.date)-new Date(a.date));
        el.innerHTML = `<div class="table-wrap"><table>
            <thead><tr>
                <th>Date</th><th>Category</th><th>Description</th><th>Paid By</th><th>Split</th><th>Total</th><th></th>
            </tr></thead>
            <tbody>
                ${sorted.map(e => `<tr>
                    <td style="color:var(--muted);font-size:12px;">${fmt(e.date)}</td>
                    <td><span class="badge">${e.category}</span></td>
                    <td>${escapeHtml(e.desc)}</td>
                    <td style="font-weight:700;">${escapeHtml(e.paidBy)}</td>
                    <td>${(e.people || []).map(p => `<span class="badge badge-split" style="margin:2px 6px 2px 0;">${escapeHtml(p.name)} $${Number(p.amount).toFixed(2)}</span>`).join('')}</td>
                    <td class="amount-cell">$${Number(e.amount).toFixed(2)}</td>
                    <td><button class="btn-remove" onclick="delS(${e.id})">✕</button></td>
                </tr>`).join('')}
            </tbody>
        </table></div>`;
    }

    function renderSummary() {
        const totP = personalExpenses.reduce((s,e)=> s + Number(e.amount), 0);
        const totS = splitExpenses.reduce((s,e)=> s + Number(e.amount), 0);
        const total = totP + totS;

        document.getElementById('s-personal').textContent = `$${totP.toFixed(2)}`;
        document.getElementById('s-split').textContent    = `$${totS.toFixed(2)}`;
        document.getElementById('s-grand').textContent    = `$${total.toFixed(2)}`;

        const cats = {};
        [...personalExpenses, ...splitExpenses].forEach(e => {
            cats[e.category] = (cats[e.category] || 0) + Number(e.amount);
        });

        const catEl = document.getElementById('catBreakdown');
        if (!Object.keys(cats).length) {
            catEl.innerHTML = `<div class="empty">No data yet</div>`;
        } else {
            catEl.innerHTML = `<div class="table-wrap"><table>
                <thead><tr><th>Category</th><th>Amount</th><th>Share</th><th>Bar</th></tr></thead>
                <tbody>${Object.entries(cats).sort((a,b)=>b[1]-a[1]).map(([cat, amt]) => {
                    const pct = total ? ((amt/total)*100).toFixed(1) : 0;
                    return `<tr>
                        <td><span class="badge">${cat}</span></td>
                        <td class="amount-cell">$${amt.toFixed(2)}</td>
                        <td style="color:var(--muted);font-size:12px;">${pct}%</td>
                        <td style="min-width:140px;">
                            <div style="background:rgba(255,255,255,.06);border-radius:999px;height:8px;overflow:hidden;border:1px solid rgba(255,255,255,.12);">
                                <div style="width:${pct}%;height:100%;background:rgba(255,255,255,.85);border-radius:999px;"></div>
                            </div>
                        </td>
                    </tr>`;
                }).join('')}</tbody>
            </table></div>`;
        }

        const bal = {};
        splitExpenses.forEach(e => {
            bal[e.paidBy] = (bal[e.paidBy] || 0) + Number(e.amount);
            (e.people || []).forEach(p => { bal[p.name] = (bal[p.name] || 0) - Number(p.amount); });
        });

        const balEl = document.getElementById('balanceSummary');
        if (!Object.keys(bal).length) {
            balEl.innerHTML = `<div class="empty">Add split expenses to see balances.</div>`;
        } else {
            balEl.innerHTML = `<div class="table-wrap"><table>
                <thead><tr><th>Person</th><th>Net</th><th>Status</th></tr></thead>
                <tbody>${Object.entries(bal).sort((a,b)=>b[1]-a[1]).map(([name, b]) => `
                    <tr>
                        <td style="font-weight:800;">${escapeHtml(name)}</td>
                        <td class="amount-cell">$${Math.abs(b).toFixed(2)}</td>
                        <td>${b > 0.005
                            ? `<span class="badge badge-split">Gets back $${b.toFixed(2)}</span>`
                            : b < -0.005
                            ? `<span class="badge badge-owe">Owes $${Math.abs(b).toFixed(2)}</span>`
                            : `<span class="badge badge-even">Settled ✓</span>`}
                        </td>
                    </tr>`).join('')}
                </tbody>
            </table></div>`;
        }
    }

    async function delP(id) {
        await api(`/api/personal/${id}`, { method: "DELETE" });
        await loadAll();
    }

    async function delS(id) {
        await api(`/api/split/${id}`, { method: "DELETE" });
        await loadAll();
    }

    function fmt(d) {
        return new Date(d + 'T00:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    }

    function escapeHtml(s){
        return String(s ?? "")
          .replaceAll("&","&amp;")
          .replaceAll("<","&lt;")
          .replaceAll(">","&gt;")
          .replaceAll('"',"&quot;")
          .replaceAll("'","&#039;");
    }

    // Initial load
    loadMe()
      .then(loadAll)
      .catch(err => { alert(err.message); window.location.href = "/"; });
</script>
</body>
</html>
